<div class="container py-2" style="margin-top: 100px;">
  <div class="row g-3 justify-content-center">

    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let f of [
      {id:'pendentes', titulo:'Pendentes', desc:'Usuários aguardando aprovação'},
      {id:'aprovados', titulo:'Aprovados', desc:'Usuários já autorizados'},
      {id:'todos', titulo:'Todos', desc:'Todos Usuários'}]">
      <div class="card text-white text-center small-card"
           role="button"
           [ngClass]="{
             'bg-primary': filtroSelecionado === f.id,
             'bg-info': filtroSelecionado !== f.id
           }"
           (click)="navegar(f.id)">
        <div class="card-body">
          <h5 class="card-title">{{f.titulo}}</h5>
          <p class="card-text">{{f.desc}}</p>
        </div>
      </div>
    </div>

  </div>
</div>

<router-outlet></router-outlet>
